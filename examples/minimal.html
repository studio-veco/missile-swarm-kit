<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>missile-swarm-kit — minimal</title>
<style>
  html, body { margin: 0; height: 100%; background: #05070b; color: #e8eef6; font: 13px system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #ui { position: fixed; left: 12px; top: 12px; display: flex; gap: 8px; align-items: center; background: rgba(0,0,0,.5); padding: 8px 10px; border-radius: 10px; }
  select, button { font: inherit; background: #111722; color: inherit; border: 1px solid #2a3344; border-radius: 6px; padding: 4px 8px; }
</style>
<!-- Serve this folder over http (ES modules do not load from file://), e.g. `npx serve ..` and open /examples/minimal.html -->
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }</script>
</head>
<body>
<div id="ui">
  <select id="craft"><option value="delphinus">DELPHINUS</option><option value="f22">F-22A</option><option value="f16">F-16C</option><option value="su37">Su-37</option><option value="mig29">MiG-29</option><option value="f2a">F-2A</option></select>
  <select id="stages"><option>1</option><option selected>2</option><option>3</option><option>4</option></select> stages
  <select id="mix"><option value="44,36,0,20">film mix</option><option value="15,15,50,20">more swirl</option><option value="0,0,0,1">wobble only</option><option value="1,0,0,0">straight only</option></select>
  <button id="go">solve</button> <span id="info"></span>
</div>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import { simulateFlight, jetState } from '../src/flight.js';
import { simulateSwarm, missileState } from '../src/missiles.js';
import { sphereWorld } from '../src/world.js';
import { buildAircraft } from '../src/aircraft/index.js';

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, logarithmicDepthBuffer: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070b);
const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 2e5);
const sunLight = new THREE.DirectionalLight(0xffffff, 2.5); sunLight.position.set(-1, 2, -1);
scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x202530, 1.4), sunLight);
// the 60 km planet as a dim sphere
const world = sphereWorld({ radius: 60000 });
const planet = new THREE.Mesh(new THREE.SphereGeometry(60000, 128, 64), new THREE.MeshStandardMaterial({ color: 0xd8dde6, roughness: 1 }));
planet.position.set(...world.center); scene.add(planet);

const jet = simulateFlight({ duration: 56, world });          // the film's manoeuvre program
let craft, swarm, trails = [], booms;

function solve() {
  const [C, E, S, W] = document.getElementById('mix').value.split(',').map(Number);
  swarm = simulateSwarm({ target: jet, world, count: 50, stages: Number(document.getElementById('stages').value), mix: { C, E, S, W }, seed: 7 });
  for (const t of trails) { scene.remove(t); t.geometry.dispose(); }
  const col = { C: 0xffffff, E: 0x27d6ff, A: 0xff3d9a, B: 0xff3d9a, D: 0xff3d9a, W: 0xa98bff, P: 0xffd27a };
  trails = swarm.missiles.map((m) => {
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(m.hist, 3));
    const line = new THREE.Line(g, new THREE.LineBasicMaterial({ color: col[m.cls] ?? 0xffffff, transparent: true, opacity: 0.75 }));
    line.frustumCulled = false; line.userData.m = m; scene.add(line); return line;
  });
  if (booms) scene.remove(booms);
  booms = new THREE.Group(); scene.add(booms);
  for (const e of swarm.explosions) { const s = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 8), new THREE.MeshBasicMaterial({ color: e.type === 'split' ? 0x9fe8ff : 0xff6aa8, transparent: true })); s.position.set(...e.pos); s.userData.e = e; booms.add(s); }
  document.getElementById('info').textContent = `${swarm.missiles.length} missiles · ${swarm.passes.length} close passes · min ${swarm.stats.minDist.toFixed(1)} m`;
  t0 = performance.now();
}
function setCraft() { if (craft) scene.remove(craft.root); craft = buildAircraft(document.getElementById('craft').value, null); scene.add(craft.root); }
document.getElementById('go').onclick = solve;
document.getElementById('craft').onchange = setCraft;
let t0 = performance.now();
setCraft(); solve();

const P = new THREE.Vector3();
renderer.setAnimationLoop(() => {
  const w = innerWidth, h = innerHeight; if (renderer.domElement.width !== Math.round(w * renderer.getPixelRatio())) { renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
  const t = ((performance.now() - t0) / 1000) % 40;
  const j = jetState(jet, t);
  craft.root.position.set(...j.p); craft.root.quaternion.set(...j.q); craft.setGlow(j.thr);
  // trails: draw from birth to now
  for (const line of trails) { const m = line.userData.m, f = t / jet.dt; line.geometry.setDrawRange(0, Math.max(0, Math.min(m.hist.length / 3, Math.floor(f - m.birth)))); line.visible = f >= m.birth; }
  for (const s of booms.children) { const a = t - s.userData.e.t; s.visible = a > 0 && a < 1.2; s.scale.setScalar(4 + 60 * Math.sqrt(Math.max(0, a)) * s.userData.e.size); s.material.opacity = 1 - a / 1.2; }
  // chase camera
  const up = world.up(j.p), v = new THREE.Vector3(...j.v).normalize();
  P.set(...j.p);
  camera.position.copy(P).addScaledVector(v, -60).addScaledVector(new THREE.Vector3(...up), 18);
  camera.up.set(...up); camera.lookAt(P);
  renderer.render(scene, camera);
});
</script>
</body>
</html>
